background = "transparent"
background_color = "#1E2326"
border = "#2E383C"
destructive = "#2E383C"
folder = "#7FBBB3"
heading = "#E67E80"
hint_bar_style = "classic"
icon_mode = "nerd"
muted = "#5E5959"
