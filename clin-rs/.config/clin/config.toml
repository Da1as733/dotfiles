zoom_factor = 1.1

[graf.physics]
ideal_distance = 100.0
tick_rate = "auto"

[graf.search]
max_results = 20
max_visible = 10

[graf.visual]
canvas_marker = "braille"
edge_color_mode = "source"
edge_thickness = 1
graph_background = "solid"
label_max_length = 30
label_mode = "all"
label_offset = 4.0
minimap_height = 12
minimap_position = "top_right"
minimap_width = 24
node_color_mode = "folder"
node_shape = "circle"
node_size = 4.0
node_size_mode = "link_count"
show_legend = true
show_minimap = true
looking_glass_height = 12
looking_glass_width = 24
show_looking_glass = true
node_scale = 5
node_fill = "dynamic"
selection_focus = "grow"

[graf.visual.colors]

[list]
calendar_enabled = true
calendar_height = 10
calendar_position = "bottom"
date_format = "%d.%m.%Y"
default_sort_field = "modified"
default_sort_order = "descending"
default_view = "tree"
density = "compact"
folders_first = true
pinned_folders = []
pinned_on_top = true
preview_enabled = true
preview_encryption = false
preview_position = "right"
preview_width_ratio = 0.7684210538864136
