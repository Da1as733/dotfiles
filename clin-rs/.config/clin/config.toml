[backup]
auto_push = false
backup_on_quit = false
backup_on_save = false
enabled = false

[core]
auto_refresh = true
code_line_numbers = true
code_theme = "base16-ocean.dark"
confirm_on_delete = true
confirm_on_quit = false
enable_key_sequences = false
keybind_preset = "default"
link_url_max_length = 80
mouse_enabled = true
preview_expand_mode = "inline"
preview_wrap = true
preview_wrap_indicator = true
storage_path = "/home/user1/Documents/database"
syntax_highlighting = true
vaults = []

[core.vault_names]

[editor]
external_command = "micro"
external_enabled = false
preview_enabled = true
show_line_numbers = true
date_format = "%Y-%m-%d %H:%M"
edit_mode_highlight = true
extended_markdown_features = true
ghost_syntax = true
soft_wrap = true
zen_hide_line_numbers = true
zen_hide_scrollbar = true
zen_focus_dimming = false
zen_focus_unit = "paragraph"
zen_focus_context = 3
copy_on_select = true
text_align = "left"
zen_padding_percent = 15

[goals]
enabled = true
note_goal = 0
word_goal = 100

[graf]
preview_enabled = true
max_node = 500

[notes]
