[[manager.prepend_keymap]]
on = ["p"]
run = "plugin sxiv"
desc = "Preview images in sxiv"

# keymap.toml
[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

[[mgr.prepend_keymap]]
on   = "]"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "["
run  = "plugin zoom -1"
desc = "Zoom out hovered file"
